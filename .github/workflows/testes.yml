name: Testes automatizados

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: "chave-temporaria-apenas-para-testes"
      ADMIN_PASSWORD: "senha-temporaria-apenas-para-testes"

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-wtf python-dotenv pytest pytest-cov

      - name: Preparar banco para testes
        run: python -c "import app; app.criar_banco()"

      - name: Executar testes
        run: python -m pytest --cov=app --cov-report=term
